<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Shore Works</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230D3D54'/><text x='8' y='23' font-family='Georgia,serif' font-size='19' fill='white' font-weight='400'>S</text><text x='19' y='23' font-family='Georgia,serif' font-size='16' fill='%234BB8B8' font-style='italic'>w</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;font-family:'Sora',sans-serif}
body{background:#EDE5D4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}

.back-link{position:fixed;top:1.25rem;left:1.5rem;font-size:12px;color:#0D3D54;text-decoration:none;display:flex;align-items:center;gap:5px;opacity:.6;transition:opacity .15s}
.back-link:hover{opacity:1}
.back-link i{font-size:14px}

.brand{text-align:center;margin-bottom:2rem}
.brand-name{font-family:'Playfair Display',serif;font-size:28px;color:#0D3D54}
.brand-name em{color:#4BB8B8;font-style:italic}
.brand-sub{font-size:12px;color:#889;margin-top:.25rem}

.card{background:#fff;border-radius:22px;padding:2.25rem;width:100%;max-width:420px;box-shadow:0 16px 56px rgba(13,61,84,.12)}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:2px solid #EDE8DF;margin-bottom:1.75rem}
.tab{flex:1;padding:10px;font-size:13px;font-weight:600;color:#aab;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;background:none;border-left:none;border-right:none;border-top:none;font-family:'Sora',sans-serif;text-align:center}
.tab.on{color:#0D3D54;border-bottom-color:#4BB8B8}

/* FORM */
.panel{display:none}
.panel.on{display:block}
.fld{margin-bottom:1rem}
.fld label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#778;margin-bottom:.4rem}
.fld input{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid #E0DBD0;background:#FDFAF6;font-family:'Sora',sans-serif;font-size:13px;color:#1a1a1a;outline:none;transition:border-color .15s}
.fld input:focus{border-color:#4BB8B8;background:#fff}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.submit-btn{width:100%;padding:13px;border-radius:100px;background:#0D3D54;color:#fff;font-family:'Sora',sans-serif;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:background .15s;margin-top:.5rem}
.submit-btn:hover{background:#0a2f40}
.submit-btn:disabled{opacity:.45;cursor:not-allowed}
.err-box{padding:.65rem 1rem;border-radius:10px;background:#FEE8E8;color:#B83030;font-size:12px;margin-bottom:.9rem;display:none}
.err-box.show{display:block}
.ok-box{padding:.65rem 1rem;border-radius:10px;background:#E8F8EE;color:#257A43;font-size:12px;margin-bottom:.9rem;display:none}
.ok-box.show{display:block}
.hint{font-size:11.5px;color:#aab;line-height:1.65;margin-top:.75rem;text-align:center}
.hint a{color:#1A6B8A;text-decoration:none}
.hint a:hover{text-decoration:underline}
.divider{display:flex;align-items:center;gap:.75rem;margin:.9rem 0;font-size:11px;color:#c0b8ad}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#EDE8DF}
.forgot{font-size:11.5px;color:#1A6B8A;text-decoration:none;display:inline-block;margin-top:.35rem}
.forgot:hover{text-decoration:underline}

@media(max-width:480px){
  .card{padding:1.75rem 1.25rem}
  .fld-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<a href="javascript:history.back()" class="back-link"><i class="ti ti-arrow-left"></i> Back</a>

<div class="brand">
  <div class="brand-name">Shore<em>works</em></div>
  <div class="brand-sub">South Jersey Business Directory &amp; Community</div>
</div>

<div class="card">
  <div class="tabs">
    <button class="tab on" id="tab-in" onclick="switchTab('in')">Sign In</button>
    <button class="tab" id="tab-up" onclick="switchTab('up')">Create Account</button>
  </div>

  <!-- SIGN IN PANEL -->
  <div class="panel on" id="panel-in">
    <div class="err-box" id="in-err"></div>
    <div class="ok-box" id="in-ok"></div>
    <div class="fld">
      <label>Email</label>
      <input type="email" id="in-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="fld">
      <label>Password</label>
      <input type="password" id="in-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
    </div>
    <a href="#" class="forgot" onclick="forgotPw(event)">Forgot password?</a>
    <button class="submit-btn" id="in-btn" onclick="signIn()">Sign In</button>
    <p class="hint">No account? <a href="#" onclick="switchTab('up');return false">Create one free →</a></p>
  </div>

  <!-- CREATE ACCOUNT PANEL -->
  <div class="panel" id="panel-up">
    <div class="err-box" id="up-err"></div>
    <div class="ok-box" id="up-ok"></div>
    <div class="fld-row">
      <div class="fld">
        <label>Your Name</label>
        <input type="text" id="up-name" placeholder="First &amp; Last" autocomplete="name">
      </div>
      <div class="fld">
        <label>Business Name</label>
        <input type="text" id="up-biz" placeholder="e.g. Shore Eats" autocomplete="organization">
      </div>
    </div>
    <div class="fld">
      <label>Email</label>
      <input type="email" id="up-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="fld">
      <label>Password</label>
      <input type="password" id="up-pass" placeholder="At least 8 characters" autocomplete="new-password" onkeydown="if(event.key==='Enter')signUp()">
    </div>
    <button class="submit-btn" id="up-btn" onclick="signUp()">Create My Account</button>
    <p class="hint">By creating an account you agree to our community guidelines — keep it helpful and respectful.</p>
    <div class="divider">or</div>
    <p class="hint">Already a member? <a href="#" onclick="switchTab('in');return false">Sign in →</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL = 'https://gjhkjtmnpckcpnnnqtbx.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqaGtqdG1ucGNrY3Bubm5xdGJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc2OTMsImV4cCI6MjA5NTU3MzY5M30.iukNPG3C1hvY6WeLrXta898i5OVNN50A48BbfWej4v8';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

function getNext() {
  return new URLSearchParams(location.search).get('next') || 'forum.html';
}

// If already logged in, redirect immediately
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) location.href = getNext();
});

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.id === 'tab-'+t));
  document.querySelectorAll('.panel').forEach(el => el.classList.toggle('on', el.id === 'panel-'+t));
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.textContent = loading ? 'Please wait…' : (btnId === 'in-btn' ? 'Sign In' : 'Create My Account');
}

async function signIn() {
  const email = document.getElementById('in-email').value.trim();
  const pass = document.getElementById('in-pass').value;
  const err = document.getElementById('in-err');
  err.classList.remove('show');
  if (!email || !pass) { err.textContent = 'Please enter your email and password.'; err.classList.add('show'); return; }
  setLoading('in-btn', true);
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  setLoading('in-btn', false);
  if (error) { err.textContent = error.message; err.classList.add('show'); return; }
  location.href = getNext();
}

async function signUp() {
  const name = document.getElementById('up-name').value.trim();
  const biz = document.getElementById('up-biz').value.trim();
  const email = document.getElementById('up-email').value.trim();
  const pass = document.getElementById('up-pass').value;
  const err = document.getElementById('up-err');
  const ok = document.getElementById('up-ok');
  err.classList.remove('show'); ok.classList.remove('show');
  if (!name || !email || !pass) { err.textContent = 'Please fill in all required fields.'; err.classList.add('show'); return; }
  if (pass.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.classList.add('show'); return; }
  setLoading('up-btn', true);
  const { error } = await sb.auth.signUp({
    email,
    password: pass,
    options: { data: { full_name: name, business_name: biz || null } }
  });
  setLoading('up-btn', false);
  if (error) { err.textContent = error.message; err.classList.add('show'); return; }
  ok.textContent = 'Account created! Check your email to confirm, then sign in.';
  ok.classList.add('show');
  // If email confirmation disabled in Supabase, sign in immediately
  const { data: { session } } = await sb.auth.getSession();
  if (session) { setTimeout(() => location.href = getNext(), 1200); }
}

async function forgotPw(e) {
  e.preventDefault();
  const email = document.getElementById('in-email').value.trim();
  const err = document.getElementById('in-err');
  const ok = document.getElementById('in-ok');
  if (!email) { err.textContent = 'Enter your email address above first.'; err.classList.add('show'); return; }
  err.classList.remove('show');
  await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/login.html' });
  ok.textContent = 'Password reset link sent — check your inbox.';
  ok.classList.add('show');
}
</script>
</body>
</html>
